name: Publish approved news

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "episodes/**"
      - "episodes.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged station
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-news.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-news.txt

      - name: Cache Japanese Piper voice
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/piper-voices
          key: piper-ja-JP-hi-fi-captain-medium-v1

      - name: Download Japanese Piper voice
        shell: bash
        env:
          PIPER_MODEL_DIR: ${{ runner.temp }}/piper-voices
        run: |
          set -euo pipefail
          python -m piper.download_voices ja_JP-hi_fi_captain-medium --download-dir "$PIPER_MODEL_DIR"
          echo "PIPER_MODEL_PATH=$PIPER_MODEL_DIR/ja_JP-hi_fi_captain-medium.onnx" >> "$GITHUB_ENV"

      - name: Restore recent published audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --no-tags origin gh-pages
            git restore --source=FETCH_HEAD --worktree -- audio/ || true
          fi

      - name: Create audio and exact caption timings
        run: python tools/generate_audio.py

      - name: Prepare the Pages snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- episodes/ episodes.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepare approved news audio"
          fi

      - name: Publish the approved episode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/publish.sh
