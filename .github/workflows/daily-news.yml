name: Daily news update

on:
  schedule:
    - cron: "10 21 * * *" # 06:10 JST
  workflow_dispatch:
    inputs:
      date:
        description: "作成する日付（YYYY-MM-DD、省略すると今日）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out station
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-news.txt

      - name: Choose episode date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          episode_date="$INPUT_DATE"
          if [[ -z "$episode_date" ]]; then
            episode_date="$(TZ=Asia/Tokyo date +'%Y-%m-%d')"
          fi
          if [[ ! "$episode_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "date は YYYY-MM-DD で指定してください" >&2
            exit 1
          fi
          echo "value=$episode_date" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-news.txt

      - name: Cache Japanese Piper voice
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/piper-voices
          key: piper-ja-JP-hi-fi-captain-medium-v1

      - name: Download Japanese Piper voice
        shell: bash
        env:
          PIPER_MODEL_DIR: ${{ runner.temp }}/piper-voices
        run: |
          set -euo pipefail
          python -m piper.download_voices ja_JP-hi_fi_captain-medium --download-dir "$PIPER_MODEL_DIR"
          echo "PIPER_MODEL_PATH=$PIPER_MODEL_DIR/ja_JP-hi_fi_captain-medium.onnx" >> "$GITHUB_ENV"

      - name: Restore recent published audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --no-tags origin gh-pages
            git restore --source=FETCH_HEAD --worktree -- audio/ || true
          fi

      - name: Generate a topic-based script
        run: python tools/generate_news.py --date "${{ steps.date.outputs.value }}"

      - name: Create audio and exact caption timings
        run: python tools/generate_audio.py --date "${{ steps.date.outputs.value }}"

      - name: Save episode to main
        shell: bash
        env:
          EPISODE_DATE: ${{ steps.date.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "episodes/$EPISODE_DATE-ja.json" episodes.json
          if git diff --cached --quiet; then
            echo "この回は既に保存されています"
          else
            git commit -m "Publish news for $EPISODE_DATE"
            git push origin HEAD:main
          fi

      - name: Publish to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/publish.sh
