name: Daily news draft

on:
  schedule:
    - cron: "10 21 * * *" # 06:10 JST
  workflow_dispatch:
    inputs:
      date:
        description: "作成する日付（YYYY-MM-DD、省略すると今日）"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out station
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Choose episode date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          episode_date="$INPUT_DATE"
          if [[ -z "$episode_date" ]]; then
            episode_date="$(TZ=Asia/Tokyo date +'%Y-%m-%d')"
          fi
          if [[ ! "$episode_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "date は YYYY-MM-DD で指定してください" >&2
            exit 1
          fi
          echo "value=$episode_date" >> "$GITHUB_OUTPUT"

      - name: Generate a topic-based script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/generate_news.py --date "${{ steps.date.outputs.value }}"

      - name: Open or update the review pull request
        id: pull-request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: main
          EPISODE_DATE: ${{ steps.date.outputs.value }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "この日付の新しい台本はありません"
            exit 0
          fi

          branch="daily-news-$EPISODE_DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add "episodes/$EPISODE_DATE-ja.json" episodes.json
          git commit -m "Draft news for $EPISODE_DATE"
          git push --force origin "$branch"

          if ! gh pr view "$branch" --repo "$REPOSITORY" --json number >/dev/null 2>&1; then
            body_file="$RUNNER_TEMP/news-pr-body.md"
            cat > "$body_file" <<'EOF'
          毎朝のニュース台本案です。

          `news-preferences.json` のジャンル設定とRSS候補から作成しました。各ニュースの出典と要点を確認してからマージしてください。マージ後に音声と字幕タイミングを作り、GitHub Pagesへ公開します。
          EOF
            gh pr create \
              --repo "$REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title "$EPISODE_DATE のニュース台本" \
              --body-file "$body_file"
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
